<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Auto Center São Bento | Gestão</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#172033;--muted:#697386;--line:#e4e8ef;--brand:#f97316;--brand2:#ea580c;--nav:#111827;--green:#15803d;--red:#b91c1c;--blue:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--nav);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:11px;padding:5px 8px 17px;border-bottom:1px solid #303847}.logo{width:43px;height:43px;border-radius:13px;background:var(--brand);display:grid;place-items:center;font-size:23px}.brand h1{font-size:15px;line-height:1.2;margin:0}.brand small{color:#aab3c2;font-size:11px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:12px;border-radius:10px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:#283244;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--brand)}.sidebar-note{margin-top:auto;color:#9ca3af;font-size:11px;line-height:1.5;padding:10px}
main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.topbar h2{font-size:19px;margin:0}.topbar p{font-size:12px;color:var(--muted);margin:4px 0 0}.top-actions{display:flex;gap:9px;align-items:center}.content{padding:26px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.page-head h3{font-size:22px;margin:0}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:10px 13px;font-weight:650;font-size:13px}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand2)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #11182705}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:25px;font-weight:800;margin:10px 0 4px;letter-spacing:-.5px}.stat .hint{font-size:11px;color:var(--muted)}.stat-icon{float:right;width:35px;height:35px;border-radius:10px;background:#fff0e6;display:grid;place-items:center}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.panel h4{margin:0 0 15px;font-size:15px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}tbody tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:700}.pill.green{background:#dcfce7;color:#166534}.pill.orange{background:#ffedd5;color:#9a3412}.pill.red{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search{max-width:360px;flex:1;min-width:170px}.field{display:grid;gap:6px}.field label{font-size:12px;color:#4b5563;font-weight:700}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d7dde7;border-radius:9px;padding:10px 11px;background:#fff;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px #f973161c}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field.full{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal-back.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:18px}.x{border:0;background:#f1f5f9;border-radius:8px;width:32px;height:32px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{padding:15px 10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px}.quick strong{display:block;margin:6px 0 3px;font-size:13px}.quick span{font-size:11px;color:var(--muted)}.chartbars{display:flex;gap:9px;align-items:end;height:145px;padding:15px 5px 0}.barbox{flex:1;text-align:center;font-size:10px;color:var(--muted)}.bar{background:#fdba74;border-radius:6px 6px 2px 2px;min-height:4px;margin-bottom:7px}.mobile-menu{display:none}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.5;margin-bottom:17px}.footer{font-size:11px;color:var(--muted);padding:22px 0;text-align:center}.hide{display:none!important}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.app{grid-template-columns:210px 1fr}.content{padding:20px}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:4;left:-260px;top:0;bottom:0;width:245px;transition:left .2s;box-shadow:10px 0 35px #0002}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{height:68px;padding:0 15px}.topbar h2{font-size:16px}.topbar p{display:none}.top-actions #exportBtn{display:none}.top-actions #logoutBtn{display:inline-flex;align-items:center;white-space:nowrap;padding:8px 10px;font-size:12px}.content{padding:16px}.cards{gap:9px}.stat{padding:14px}.stat .value{font-size:21px}.stat .label{font-size:11px}.page-head{align-items:flex-start}.page-head h3{font-size:19px}.page-head .btn{font-size:12px;padding:9px}.quick{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:14px}.stat-icon{width:29px;height:29px}.table-wrap{margin:0 -5px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="authScreen" style="min-height:100vh;display:none;place-items:center;padding:20px;background:#f3f5f9">
 <form id="loginForm" style="width:min(420px,100%);background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:26px;box-shadow:0 12px 40px #11182712">
  <div style="font-size:34px">🔧</div><h2 style="margin:8px 0">Auto Center São Bento</h2><p style="color:#697386;font-size:13px;margin-bottom:20px">Entre para acessar seu painel e sincronizar seus dados.</p>
  <label style="display:block;font-size:12px;font-weight:700;margin:12px 0 6px">E-mail</label><input id="loginEmail" type="email" required autocomplete="username" style="width:100%;padding:12px;border:1px solid #d7dde7;border-radius:9px">
  <label style="display:block;font-size:12px;font-weight:700;margin:12px 0 6px">Senha</label><input id="loginPassword" type="password" required autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #d7dde7;border-radius:9px">
  <button type="submit" style="width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#f97316;color:#fff;font-weight:700">Entrar</button>
  <p id="authMessage" style="font-size:12px;color:#b91c1c;line-height:1.5"></p>
 </form>
</div>
<div class="app" id="mainApp" style="display:none">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">🔧</div><div><h1>AUTO CENTER<br>SÃO BENTO</h1><small>Sistema de gestão</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard">▦ <span>Visão geral</span></button>
    <button data-page="estoque">▤ <span>Estoque</span></button>
    <button data-page="vendas">🛒 <span>Vendas</span></button>
    <button data-page="clientes">♙ <span>Clientes</span></button>
    <button data-page="servicos">🔧 <span>Serviços e preços</span></button>
    <button data-page="ordens">▣ <span>Ordens de serviço</span></button>
    <button data-page="agenda">▦ <span>Agendamentos</span></button>
    <button data-page="financeiro">R$ <span>Financeiro</span></button>
    <button data-page="relatorios">▥ <span>Relatórios</span></button>
  </nav>
  <div class="sidebar-note">Versão inicial • Dados salvos neste navegador.<br>Próxima etapa: banco online seguro.</div>
</aside>
<main>
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div><h2 id="topTitle">Visão geral</h2><p id="todayLabel"></p></div></div><div class="top-actions"><button class="btn" id="exportBtn">Exportar dados</button><button class="btn" id="logoutBtn">Sair</button><button class="btn primary" id="quickSale">＋ Nova venda</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Novo cadastro</h3><button class="x" id="modalX">✕</button></div><form id="modalForm"><div class="form-grid" id="modalFields"></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancelar</button><button class="btn primary" type="submit">Salvar cadastro</button></div></form></div></div>
<script>
const KEY='acsb_v1_data';
const blank={products:[],clients:[],services:[],sales:[],appointments:[],orders:[],transactions:[]};
let db=loadDB(),page='dashboard',editing=null,searchTerm='';
function loadDB(){try{return {...blank,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(blank)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();syncCloud()}
const $=s=>document.querySelector(s);
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const sum=(arr,fn)=>arr.reduce((a,x)=>a+(Number(fn(x))||0),0);
$('#todayLabel').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
const titles={dashboard:'Visão geral',estoque:'Estoque',vendas:'Vendas',clientes:'Clientes',servicos:'Serviços e preços',ordens:'Ordens de serviço',agenda:'Agendamentos',financeiro:'Financeiro',relatorios:'Relatórios'};
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function go(p){page=p;searchTerm='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent=titles[p];$('#sidebar').classList.remove('open');render()}
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#quickSale').onclick=()=>openForm('sales');
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='auto-center-sao-bento-backup.json';a.click();URL.revokeObjectURL(a.href)};
function stat(label,value,icon,hint=''){return `<div class="stat"><div class="stat-icon">${icon}</div><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}
function pageHead(title,desc,btn,action){return `<div class="page-head"><div><h3>${title}</h3><p>${desc}</p></div>${btn?`<button class="btn primary" onclick="${action}">＋ ${btn}</button>`:''}</div>`}
function table(headers,rows,empty='Nenhum registro cadastrado ainda.'){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty">${empty}</div></td></tr>`}</tbody></table></div>`}
function filterBar(placeholder='Buscar...'){return `<div class="toolbar"><input class="search" id="searchInput" placeholder="${placeholder}" value="${esc(searchTerm)}" oninput="setSearch(this.value)"><button class="btn" onclick="clearSearch()">Limpar busca</button></div>`}
window.setSearch=v=>{searchTerm=v;let y=$('#content').querySelector('tbody');if(y)render()};
window.clearSearch=()=>{searchTerm='';render()};
function matches(...vals){return vals.join(' ').toLowerCase().includes(searchTerm.toLowerCase())}
function actions(type,id){return `<button class="btn small" onclick="editItem('${type}','${id}')">Editar</button> <button class="btn small danger" onclick="deleteItem('${type}','${id}')">Excluir</button>`}
function render(){
const c=$('#content');
if(page==='dashboard'){
const month=today().slice(0,7),sales=db.sales.filter(x=>(x.date||'').startsWith(month)),rev=sum(sales,x=>x.total),expenses=sum(db.transactions.filter(x=>x.type==='Despesa'&&(x.date||'').startsWith(month)),x=>x.amount),low=db.products.filter(x=>Number(x.qty)<=Number(x.min||0));
let upcoming=db.appointments.filter(x=>x.date>=today()&&x.status!=='Cancelado').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
c.innerHTML=`<div class="notice"><b>Bem-vindo ao Auto Center São Bento!</b> Esta primeira versão já permite cadastrar e movimentar dados neste navegador. Para acessar os mesmos dados em vários aparelhos, ainda precisaremos ativar o banco de dados online.</div>
${pageHead('Resumo da oficina','Acompanhe os principais números do seu negócio.','Nova ordem',"openForm('orders')")}
<div class="cards">${stat('Vendas neste mês',money(rev),'💰',sales.length+' venda(s) registrada(s)')}${stat('Despesas neste mês',money(expenses),'↘','Lançamentos financeiros')}${stat('Produtos cadastrados',db.products.length,'📦',low.length+' com estoque baixo')}${stat('Agendamentos futuros',db.appointments.filter(x=>x.date>=today()&&x.status!=='Cancelado').length,'📅','Inclui serviços pendentes')}</div>
<div class="split"><div class="panel"><h4>Atalhos rápidos</h4><div class="quick"><button onclick="openForm('products')">📦<strong>Novo produto</strong><span>Cadastrar item no estoque</span></button><button onclick="openForm('clients')">♙<strong>Novo cliente</strong><span>Salvar contato</span></button><button onclick="openForm('sales')">🛒<strong>Registrar venda</strong><span>Movimentar o caixa</span></button><button onclick="openForm('appointments')">📅<strong>Agendar serviço</strong><span>Reservar data e hora</span></button><button onclick="openForm('orders')">🔧<strong>Ordem de serviço</strong><span>Registrar trabalho</span></button><button onclick="go('financeiro')">📊<strong>Financeiro</strong><span>Receitas e despesas</span></button></div></div>
<div class="panel"><h4>Próximos agendamentos</h4>${upcoming.length?table(['Data','Cliente','Serviço','Status'],upcoming.map(x=>`<tr><td>${fmtDate(x.date)} ${esc(x.time||'')}</td><td>${esc(x.client)}</td><td>${esc(x.service)}</td><td><span class="pill orange">${esc(x.status||'Agendado')}</span></td></tr>`)):'<div class="empty">Nenhum agendamento futuro. Use “Agendar serviço” para começar.</div>'}</div></div>
<div class="panel" style="margin-top:16px"><h4>Estoque que precisa de atenção</h4>${low.length?table(['Produto','Quantidade','Mínimo','Situação'],low.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${x.min||0}</td><td><span class="pill red">Estoque baixo</span></td></tr>`)):'<div class="empty">Nenhum produto abaixo do estoque mínimo.</div>'}</div>`;
}else if(page==='estoque'){
let a=db.products.filter(x=>matches(x.name,x.code,x.category));c.innerHTML=pageHead('Estoque','Produtos, quantidades, custo e preço de venda.','Cadastrar produto',"openForm('products')")+filterBar('Buscar produto ou código...')+`<div class="panel">${table(['Produto / código','Categoria','Qtd.','Custo','Venda','Margem bruta un.','Status','Ações'],a.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.code||'Sem código')}</small></td><td>${esc(x.category||'—')}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td>${money((x.price||0)-(x.cost||0))}</td><td><span class="pill ${Number(x.qty)<=Number(x.min||0)?'red':'green'}">${Number(x.qty)<=Number(x.min||0)?'Estoque baixo':'Disponível'}</span></td><td>${actions('products',x.id)}</td></tr>`))}</div>`;
}else if(page==='clientes'){
let a=db.clients.filter(x=>matches(x.name,x.phone,x.email));c.innerHTML=pageHead('Clientes','Contatos e histórico básico de atendimento.','Novo cliente',"openForm('clients')")+filterBar('Buscar nome, telefone ou e-mail...')+`<div class="panel">${table(['Nome','Telefone','E-mail','Observações','Ações'],a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.notes||'—')}</td><td>${actions('clients',x.id)} ${x.phone?`<button class="btn small" onclick="whatsapp('${esc(x.phone)}','Olá ${esc(x.name)}, aqui é do Auto Center São Bento.')">WhatsApp</button>`:''}</td></tr>`))}</div>`;
}else if(page==='servicos'){
let a=db.services.filter(x=>matches(x.name,x.category));c.innerHTML=pageHead('Serviços e preços','Cadastre mão de obra e outros serviços oferecidos.','Novo serviço',"openForm('services')")+filterBar('Buscar serviço...')+`<div class="panel">${table(['Serviço','Categoria','Preço padrão','Duração estimada','Ações'],a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category||'—')}</td><td>${money(x.price)}</td><td>${esc(x.duration||'—')}</td><td>${actions('services',x.id)}</td></tr>`))}</div>`;
}else if(page==='vendas'){
let a=db.sales.filter(x=>matches(x.client,x.product,x.payment,x.id));c.innerHTML=pageHead('Vendas','Registre vendas e acompanhe o histórico.','Nova venda',"openForm('sales')")+filterBar('Buscar venda, cliente ou produto...')+`<div class="panel">${table(['Data','Venda','Cliente','Item','Qtd.','Pagamento','Total','Ações'],a.slice().reverse().map(x=>`<tr><td>${fmtDate(x.date)}</td><td>#${esc(x.id.slice(-6))}</td><td>${esc(x.client||'Balcão')}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${esc(x.payment)}</td><td><b>${money(x.total)}</b></td><td>${actions('sales',x.id)}</td></tr>`))}</div>`;
}else if(page==='agenda'){
let a=db.appointments.filter(x=>matches(x.client,x.phone,x.service,x.status,x.date));c.innerHTML=pageHead('Agendamentos','Organize a agenda e acompanhe cada atendimento.','Novo agendamento',"openForm('appointments')")+filterBar('Buscar cliente, serviço ou data...')+`<div class="panel">${table(['Data e hora','Cliente','Telefone','Serviço','Status','Ações'],a.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).map(x=>`<tr><td><b>${fmtDate(x.date)}</b><br>${esc(x.time||'')}</td><td>${esc(x.client)}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.service)}</td><td><select onchange="updateStatus('appointments','${x.id}',this.value)">${['Agendado','Confirmado','Em andamento','Concluído','Cancelado'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`)}</select></td><td>${actions('appointments',x.id)} ${x.phone?`<button class="btn small" onclick="whatsapp('${esc(x.phone)}','Olá ${esc(x.client)}, confirmamos seu agendamento no Auto Center São Bento para ${fmtDate(x.date)} às ${esc(x.time||'')}.')">WhatsApp</button>`:''}</td></tr>`))}</div>`;
}else if(page==='ordens'){
let a=db.orders.filter(x=>matches(x.client,x.service,x.description,x.status,x.id));c.innerHTML=pageHead('Ordens de serviço','Registre o serviço combinado, valor e andamento.','Nova ordem',"openForm('orders')")+filterBar('Buscar cliente, serviço ou número...')+`<div class="panel">${table(['OS','Abertura','Cliente','Serviço / descrição','Valor','Status','Ações'],a.slice().reverse().map(x=>`<tr><td><b>#${esc(x.id.slice(-6))}</b></td><td>${fmtDate(x.date)}</td><td>${esc(x.client)}</td><td>${esc(x.service)}<br><small>${esc(x.description||'')}</small></td><td>${money(x.price)}</td><td><select onchange="updateStatus('orders','${x.id}',this.value)">${['Aberta','Aguardando aprovação','Em andamento','Concluída','Entregue','Cancelada'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`)}</select></td><td>${actions('orders',x.id)} ${x.phone?`<button class="btn small" onclick="whatsapp('${esc(x.phone)}','Olá ${esc(x.client)}, atualização da sua ordem de serviço no Auto Center São Bento: ${esc(x.status)}.')">WhatsApp</button>`:''}</td></tr>`))}</div>`;
}else if(page==='financeiro'){

function openForm(type,id=null){
editing=id?{type,id}:null;const s=schemas[type];$('#modalTitle').textContent=(id?'Editar':'Novo')+' '+s.type.toLowerCase();let obj=id?db[type].find(x=>x.id===id)||{}:{date:today(),qty:1,min:0,status:type==='orders'?'Aberta':type==='appointments'?'Agendado':undefined,payment:'Pix'};

  await activateSession(data.session.user);

async function activateSession(user){

 try{
  const {data,error}=await supabaseClient.from('auto_center_data').select('data').eq('user_id',user.id).maybeSingle();

 if(!cloudUser) return;
 clearTimeout(syncTimer);
 syncTimer=setTimeout(async()=>{
