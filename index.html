<style>

.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#3a2115 0,transparent 35%),var(--bg)}.login-card{width:min(420px,100%);background:var(--side);border:1px solid var(--line);padding:30px;border-radius:22px;box-shadow:0 24px 80px #0008}.brand-mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#bd4810);display:grid;place-items:center;font-size:25px;font-weight:900}.login h1{margin:16px 0 5px;font-size:25px}.muted{color:var(--muted)}.login p{line-height:1.5}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.search{width:100%;background:#11151b;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--orange)}

.main{margin-left:250px;padding:28px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:26px}.eyebrow{font-size:11px;color:var(--orange2);font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.topbar h1{font-size:27px;margin:5px 0}.top-actions{display:flex;gap:9px;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:23px;margin:9px 0 4px}.stat small{color:var(--muted)}.stat-icon{float:right;background:#3a281e;color:var(--orange2);padding:9px;border-radius:10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:15px;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panel h3{margin:0;font-size:15px}.toolbar{display:flex;gap:10px;align-items:center;margin:15px 0}.search{max-width:420px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #2b3039;font-size:13px}tr:last-child td{border:0}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#303641;color:#dce1e8;font-size:11px}.pill.green{background:#173c31;color:#66e0b1}.pill.orange{background:#49301e;color:#ffb16f}.pill.red{background:#472626;color:#ff9292}.actions{display:flex;gap:5px;white-space:nowrap}.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.category{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.category h3{margin:0 0 12px;font-size:14px;color:var(--orange2)}.service-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}.service-row b{white-space:nowrap}.empty{padding:35px;text-align:center;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.modal-back.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--side);border:1px solid var(--line);border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:19px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.field.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.notice{color:var(--muted);font-size:12px;margin-top:12px}

<body>
<section id="loginScreen" class="login"><div class="login-card"><div class="brand-mark">🔧</div><h1>Auto Center <span style="color:var(--orange)">São Bento</span></h1><p class="muted">Gestão inteligente da sua oficina. Entre para acessar seu painel.</p><form id="loginForm"><div class="field"><label>E-MAIL</label><input id="email" type="email" required autocomplete="username" placeholder="seu@email.com"></div><div class="field"><label>SENHA</label><input id="password" type="password" required autocomplete="current-password" placeholder="Sua senha"></div><button class="btn primary" style="width:100%;margin-top:8px">Entrar no sistema</button></form><p id="loginMsg" class="notice"></p></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><div class="brand-mark">🔧</div><div><b>AUTO CENTER<br>SÃO BENTO</b><small>PAINEL DE GESTÃO</small></div></div><div class="nav-label">MENU PRINCIPAL</div><nav id="nav" class="nav"></nav><div class="side-bottom">Sistema de gestão da oficina<br>Seus dados sincronizados na nuvem.</div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">AUTO CENTER SÃO BENTO</div><h1 id="pageTitle">Visão geral</h1><div class="muted" id="pageSubtitle">Resumo da sua oficina</div></div><div class="top-actions"><button class="btn" onclick="exportBackup()">Backup</button><button class="btn" onclick="logout()">Sair</button><button class="btn primary" onclick="quickNew()">＋ Novo cadastro</button></div></header><div id="content"></div></main></div>
<div id="modalBack" class="modal-back"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Novo cadastro</h2><button class="btn small" onclick="closeModal()">✕</button></div><form id="dataForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar registro</button></div></form></div></div>
<script>
const SUPABASE_URL='https://iueiooqpdcnelrbsggss.supabase.co';
const SUPABASE_KEY='sb_publishable_KEIUQoiiAxXzBn_6pcefjw_SjjX6Kae';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='acsb_v1_data';
const blank={products:[],clients:[],services:[],sales:[],appointments:[],orders:[],transactions:[]};
let db=structuredClone(blank),user=null,current='dashboard',editing=null,searchText='';
const $=s=>document.querySelector(s), money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10), id=()=>crypto.randomUUID();
const categories={
'Direção e terminais':[['Terminal',50],['Pivô sem rebite',50],['Pivô com rebite',100],['Axial',70]],
'Suspensão':[['Morceguinho',60],['Bandeja inferior carro passeio',100],['Bandeja inferior caminhonete',150],['Bandeja superior caminhonete',150],['Amortecedor dianteiro',100],['Amortecedor traseiro',100],['Kit amortecedor dianteiro',100],['Kit amortecedor traseiro',100],['Bieleta',50],['Troca de coxim do motor',70]],
'Freios':[['Pastilha dianteira',80],['Pastilha traseira',100],['Jogo de lona',100],['Cilindro de roda',50],['Troca de fluido',150],['Cilindro mestre',200],['Hidrovácuo',250]],
'Rolamentos':[['Rolamento dianteiro',100],['Rolamento traseiro',100]],
'Manutenção preventiva':[['Troca de óleo',50],['Filtro de cabine',50]],
'Alinhamento e geometria':[['Regulagem de eixo traseiro',60],['Alinhamento',60],['Balanceamento',30],['Cambagem',60],['Caster',90]]
};
const navItems=[['dashboard','▦','Visão geral'],['products','▣','Estoque'],['sales','↗','Vendas'],['clients','♙','Clientes'],['services','🔧','Serviços e preços'],['orders','▤','Ordens de serviço'],['appointments','▦','Agendamentos'],['transactions','＄','Financeiro'],['reports','▥','Relatórios']];
function renderNav(){$('#nav').innerHTML=navItems.map(([k,ic,n])=>`<button class="${current===k?'active':''}" onclick="go('${k}')"><span class="ico">${ic}</span>${n}</button>`).join('')}
function go(p){current=p;searchText='';render()}
function fmtDate(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—'}
function total(arr,key){return arr.reduce((s,x)=>s+(Number(x[key])||0),0)}
function pageHead(title,sub,button,action){return `<div class="panel-head"><div><h3>${title}</h3><div class="muted" style="font-size:12px;margin-top:5px">${sub}</div></div>${button?`<button class="btn primary" onclick="${action}">＋ ${button}</button>`:''}</div>`}
function stat(label,value,icon,foot=''){return `<div class="stat"><span class="stat-icon">${icon}</span><div class="label">${label}</div><strong>${value}</strong><small>${foot}</small></div>`}
function filtered(arr,keys){return arr.filter(x=>!searchText||keys.some(k=>String(x[k]??'').toLowerCase().includes(searchText.toLowerCase())))}
function toolbar(placeholder='Buscar...'){return `<div class="toolbar"><input class="search" placeholder="${placeholder}" value="${esc(searchText)}" oninput="searchText=this.value;renderContentOnly()"></div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`}
function acts(type,x){return `<div class="actions"><button class="btn small" onclick="openModal('${type}','${x.id}')">Editar</button><button class="btn small danger" onclick="del('${type}','${x.id}')">Excluir</button></div>`}
function render(){renderNav();let names=Object.fromEntries(navItems.map(x=>[x[0],x[2]]));$('#pageTitle').textContent=names[current];$('#pageSubtitle').textContent='Controle sua oficina em um só lugar';renderContentOnly()}
function renderContentOnly(){let c=$('#content');if(current==='dashboard'){let inc=total(db.transactions.filter(x=>x.type==='Receita'),'amount'),out=total(db.transactions.filter(x=>x.type==='Despesa'),'amount');c.innerHTML=`<div class="cards">${stat('Clientes cadastrados',db.clients.length,'♙')}${stat('Produtos no estoque',db.products.length,'▣')}${stat('Ordens em aberto',db.orders.filter(x=>!['Concluída','Entregue','Cancelada'].includes(x.status)).length,'🔧')}${stat('Saldo financeiro',money(inc-out),'＄')}</div><div class="panel">${pageHead('Acesso rápido','Escolha uma área para continuar') }<div class="category-grid">${navItems.slice(1).map(([k,ic,n])=>`<button class="btn" style="text-align:left;padding:18px" onclick="go('${k}')"><span style="font-size:22px">${ic}</span><br><b>${n}</b><div class="muted" style="font-size:11px;margin-top:5px">Abrir módulo →</div></button>`).join('')}</div></div>`;return}
if(current==='services'){let rows=db.services;let groups=Object.keys(categories).map(cat=>{let ss=rows.filter(s=>s.category===cat);return `<div class="category"><h3>${cat}</h3>${ss.length?ss.map(s=>`<div class="service-row"><span>${esc(s.name)}</span><b>${money(s.price)}</b></div>`).join(''):`<div class="muted" style="font-size:12px">Nenhum serviço cadastrado.</div>`}</div>`}).join('');c.innerHTML=pageHead('Catálogo de serviços','Serviços separados por categoria e preços em reais.','Cadastrar serviço',"openModal('services')")+`<div class="category-grid">${groups}</div><div class="panel">${pageHead('Todos os serviços','Edite valores e informações cadastradas')}</div>${toolbar('Buscar serviço ou categoria...')}`+table(['Serviço','Categoria','Preço','Duração','Ações'],filtered(rows,['name','category']).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${money(x.price)}</td><td>${esc(x.duration||'—')}</td><td>${acts('services',x)}</td></tr>`).join(''));return}
const cfg={
products:{title:'Estoque',sub:'Produtos e quantidades',fields:[['name','Nome do produto','text',1],['code','Código / referência','text'],['category','Categoria','text'],['qty','Quantidade','number',1],['min','Estoque mínimo','number'],['cost','Preço de custo (R$)','number'],['price','Preço de venda (R$)','number']],heads:['Produto','Código','Categoria','Qtd.','Custo','Venda','Ações'],keys:['name','code','category'],row:x=>`<td><b>${esc(x.name)}</b></td><td>${esc(x.code||'—')}</td><td>${esc(x.category||'—')}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td>${money(x.price)}</td><td>${acts('products',x)}</td>`},
clients:{title:'Clientes',sub:'Cadastro e contato',fields:[['name','Nome do cliente','text',1],['phone','Telefone / WhatsApp','tel'],['email','E-mail','email'],['notes','Observações','textarea']],heads:['Cliente','Telefone','E-mail','Observações','Ações'],keys:['name','phone','email'],row:x=>`<td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.notes||'—')}</td><td>${acts('clients',x)}</td>`},
orders:{title:'Ordens de serviço',sub:'Acompanhe serviços e veículos',fields:[['date','Data de abertura','date',1],['client','Nome do cliente','text',1],['phone','Telefone','tel'],['plate','Placa','text',1],['vehicleModel','Modelo do veículo','text',1],['service','Serviço','text',1],['description','Descrição','textarea'],['price','Valor combinado (R$)','number',1],['status','Status','select',1,['Aberta','Aguardando aprovação','Em andamento','Concluída','Entregue','Cancelada']]],heads:['OS','Data','Cliente','Placa','Veículo','Serviço','Valor','Status','Ações'],keys:['client','plate','vehicleModel','service','status'],row:x=>`<td>#${esc(String(x.id).slice(-6))}</td><td>${fmtDate(x.date)}</td><td>${esc(x.client)}</td><td><b>${esc(x.plate)}</b></td><td>${esc(x.vehicleModel)}</td><td>${esc(x.service)}</td><td>${money(x.price)}</td><td><span class="pill orange">${esc(x.status)}</span></td><td>${acts('orders',x)}</td>`},
appointments:{title:'Agendamentos',sub:'Organize os próximos atendimentos',fields:[['client','Cliente','text',1],['phone','Telefone','tel'],['plate','Placa','text',1],['vehicleModel','Modelo do veículo','text',1],['service','Serviço solicitado','text',1],['date','Data','date',1],['time','Horário','time',1],['status','Status','select',1,['Agendado','Confirmado','Em andamento','Concluído','Cancelado']],['notes','Observações','textarea']],heads:['Data','Horário','Cliente','Placa','Veículo','Serviço','Status','Ações'],keys:['client','plate','vehicleModel','service','status'],row:x=>`<td>${fmtDate(x.date)}</td><td>${esc(x.time)}</td><td>${esc(x.client)}</td><td>${esc(x.plate)}</td><td>${esc(x.vehicleModel)}</td><td>${esc(x.service)}</td><td>${esc(x.status)}</td><td>${acts('appointments',x)}</td>`},
sales:{title:'Vendas',sub:'Registre vendas de produtos e serviços',fields:[['date','Data','date',1],['client','Cliente ou balcão','text'],['product','Produto / serviço','text',1],['qty','Quantidade','number',1],['unitPrice','Preço unitário (R$)','number',1],['payment','Pagamento','select',1,['Dinheiro','Pix','Débito','Crédito','Transferência','A prazo']]],heads:['Data','Cliente','Produto / serviço','Qtd.','Total','Pagamento','Ações'],keys:['client','product','payment'],row:x=>`<td>${fmtDate(x.date)}</td><td>${esc(x.client||'Balcão')}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${esc(x.payment)}</td><td>${acts('sales',x)}</td>`},
transactions:{title:'Financeiro',sub:'Entradas e saídas do caixa',fields:[['date','Data','date',1],['type','Tipo','select',1,['Receita','Despesa']],['description','Descrição','text',1],['category','Categoria','text'],['amount','Valor (R$)','number',1],['payment','Pagamento','select',0,['Dinheiro','Pix','Débito','Crédito','Transferência','Boleto','Outro']]],heads:['Data','Tipo','Descrição','Categoria','Pagamento','Valor','Ações'],keys:['type','description','category'],row:x=>`<td>${fmtDate(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.description)}</td><td>${esc(x.category||'—')}</td><td>${esc(x.payment||'—')}</td><td>${money(x.amount)}</td><td>${acts('transactions',x)}</td>`}
};
if(current==='reports'){c.innerHTML=`<div class="cards">${stat('Vendas registradas',money(total(db.sales,'total')),'↗',db.sales.length+' venda(s)')}${stat('Receitas',money(total(db.transactions.filter(x=>x.type==='Receita'),'amount')),'＋')}${stat('Despesas',money(total(db.transactions.filter(x=>x.type==='Despesa'),'amount')),'－')}${stat('Ordens de serviço',db.orders.length,'🔧')}</div><div class="panel">${pageHead('Resumo da oficina','Indicadores calculados com os registros atuais')}<p>Clientes: <b>${db.clients.length}</b></p><p>Produtos: <b>${db.products.length}</b></p><p>Agendamentos: <b>${db.appointments.length}</b></p><p>Serviços cadastrados: <b>${db.services.length}</b></p><button class="btn primary" onclick="exportBackup()">Baixar backup dos dados</button></div>`;return}
let conf=cfg[current],arr=filtered(db[current],conf.keys);let rows=arr.slice().reverse().map(x=>`<tr>${conf.row(x)}</tr>`).join('');let extra=current==='transactions'?`<div class="cards">${stat('Receitas',money(total(db.transactions.filter(x=>x.type==='Receita'),'amount')),'↗')}${stat('Despesas',money(total(db.transactions.filter(x=>x.type==='Despesa'),'amount')),'↘')}</div>`:'';c.innerHTML=extra+pageHead(conf.title,conf.sub,'Novo registro',`openModal('${current}')`)+toolbar()+table(conf.heads,rows)
}
function quickNew(){let p=current==='dashboard'?'clients':current;openModal(['reports','services'].includes(p)?'services':p)}
function openModal(type,editId=null){editing={type,id:editId};let conf=type==='services'?{title:'Serviço',fields:[['name','Nome do serviço','text',1],['category','Categoria','select',1,Object.keys(categories)],['price','Preço padrão (R$)','number',1],['duration','Duração estimada','text']]}:type==='sales'?{title:'Venda',fields:cfg.sales.fields}:cfg[type];if(!conf)return;let old=editId?db[type].find(x=>x.id===editId)||{}:{};$('#modalTitle').textContent=(editId?'Editar ':'Cadastrar ')+conf.title.toLowerCase();$('#formFields').innerHTML=conf.fields.map(([k,label,kind,req,opts])=>{let val=old[k]??(k==='date'?today():k==='qty'?1:k==='status'?(type==='orders'?'Aberta':'Agendado'):'');let input=kind==='textarea'?`<textarea name="${k}" rows="3">${esc(val)}</textarea>`:kind==='select'?`<select name="${k}" ${req?'required':''}>${(opts||[]).map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${k}" type="${kind}" value="${esc(val)}" ${req?'required':''} ${kind==='number'?'min="0" step="0.01"':''}>`;return `<div class="field ${kind==='textarea'?'full':''}"><label>${label}${req?' *':''}</label>${input}</div>`}).join('');$('#modalBack').classList.add('show')}
function closeModal(){$('#modalBack').classList.remove('show');editing=null}
$('#dataForm').onsubmit=async e=>{e.preventDefault();let {type,id:editId}=editing,form=new FormData(e.currentTarget),obj=Object.fromEntries(form.entries());['qty','min','cost','price','unitPrice','amount'].forEach(k=>{if(k in obj)obj[k]=Number(obj[k]||0)});if(type==='sales'){obj.total=Number(obj.qty)*Number(obj.unitPrice);obj.costTotal=0}
obj.id=editId||id();if(editId){let i=db[type].findIndex(x=>x.id===editId);if(i>=0)db[type][i]={...db[type][i],...obj}}else db[type].push(obj);await save();closeModal();render()};
async function del(type,rid){if(!confirm('Excluir este registro?'))return;db[type]=db[type].filter(x=>x.id!==rid);await save();render()}
async function save(){localStorage.setItem(KEY,JSON.stringify(db));renderNav();await sync()}
let timer;async function sync(){if(!user)return;clearTimeout(timer);timer=setTimeout(async()=>{let {error}=await sb.from('auto_center_data').upsert({user_id:user.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)alert('Falha ao sincronizar: '+error.message)},350)}
async function logout(){
  await sb.auth.signOut();
}

function seedServices(){if(db.services.length)return;Object.entries(categories).forEach(([category,items])=>items.forEach(([name,price])=>db.services.push({id:id(),name,category,price,duration:''})));localStorage.setItem(KEY,JSON.stringify(db))}\nfunction exportBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-auto-center-sao-bento.json';a.click();URL.revokeObjectURL(a.href)}
async function activate(u){user=u;$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');try{let {data,error}=await sb.from('auto_center_data').select('data').eq('user_id',u.id).maybeSingle();if(error)throw error;if(data?.data)db={...structuredClone(blank),...data.data};else{let old=localStorage.getItem(KEY);if(old)try{db={...structuredClone(blank),...JSON.parse(old)}}catch{}await sb.from('auto_center_data').upsert({user_id:u.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'})}seedServices();localStorage.setItem(KEY,JSON.stringify(db));await sb.from('auto_center_data').upsert({user_id:user.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});render()}catch(e){$('#loginMsg').textContent='Erro ao carregar dados: '+e.message;$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden')}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='Conectando...';let {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)$('#loginMsg').textContent='Não foi possível entrar: '+error.message;else await activate(data.user)};
sb.auth.getSession().then(({data})=>{if(data.session)activate(data.session.user)});sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden')}});
</script>
</body></html>
