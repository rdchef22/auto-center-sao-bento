
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d14">
<title>Auto Center São Bento | Gestão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--bg:#090d14;
--side:#0d131d;
--panel:#121b28;
--panel2:#192536;
--line:#263548;
--text:#f5f7fb;
--muted:#91a0b4;
--orange:#ff812e;
--orange2:#ffad70;
--green:#35d6a0;
--red:#ff7070;
--blue:#70aaff;
--radius:20px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;background:
radial-gradient(ellipse at 85% 0%,#ff812e0b,transparent 35%),
var(--bg);
color:var(--text);
font:14px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
::selection{background:#ff812e55;color:white}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0d131d}
::-webkit-scrollbar-thumb{background:#344357;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:#ff812e}

/* LOGIN */
.login{
min-height:100vh;display:grid;place-items:center;padding:22px;
background:
radial-gradient(ellipse at 50% 0%,#ff812e28,transparent 48%),
radial-gradient(ellipse at 0% 100%,#24528b22,transparent 45%),
#090d14;
}
.login-card{
width:min(440px,100%);
background:linear-gradient(145deg,#172333,#101722);
border:1px solid #35475b;
padding:38px;border-radius:27px;
box-shadow:0 35px 100px #0009,0 0 50px #ff812e0b;
}
.brand-mark{
width:57px;height:57px;border-radius:18px;
background:linear-gradient(135deg,#ffad70,#f36b17);
display:grid;place-items:center;font-size:28px;
box-shadow:0 9px 30px #ff812e44;
}
.login h1{margin:23px 0 8px;font-size:28px;letter-spacing:-1.2px}
.muted{color:var(--muted)}
.login p{line-height:1.7}
.field{display:flex;flex-direction:column;gap:8px;margin:15px 0}
.field label{
font-size:10px;color:#aebbd0;font-weight:900;
letter-spacing:1px;text-transform:uppercase;
}
.field input,.field select,.field textarea,.search{
width:100%;background:#0b121c;
border:1px solid #304055;border-radius:13px;
padding:13px 14px;color:var(--text);outline:none;
transition:border .2s,box-shadow .2s,background .2s;
}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{
border-color:var(--orange);
background:#101a27;
box-shadow:0 0 0 3px #ff812e20;
}
.field textarea{resize:vertical;min-height:85px}
.field select option{background:#121b28;color:white}

/* BOTÕES */
.btn{
border:1px solid #344358;border-radius:12px;
padding:11px 16px;background:#1a2737;
color:var(--text);font-weight:750;
transition:.2s;
}
.btn:hover{
filter:brightness(1.17);transform:translateY(-2px);
border-color:#61748d;
}
.btn:active{transform:scale(.98)}
.btn.primary{
background:linear-gradient(135deg,#ffad70,#ff791f);
border:0;color:#1c120c;
box-shadow:0 6px 20px #ff812e30;
}
.btn.primary:hover{box-shadow:0 8px 26px #ff812e50}
.btn.danger{color:#ff9292;border-color:#773c43;background:#351d25}
.btn.small{padding:7px 10px;font-size:11px;border-radius:9px}

/* ESTRUTURA */
.app{min-height:100vh}
.sidebar{
position:fixed;inset:0 auto 0 0;width:265px;
background:linear-gradient(180deg,#111b29,#0b111a);
border-right:1px solid #26364a;
padding:25px 16px;
display:flex;flex-direction:column;z-index:5;
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 32px}
.brand .brand-mark{width:46px;height:46px;border-radius:15px}
.brand b{display:block;font-size:13px;letter-spacing:1px;line-height:1.5}
.brand small{color:var(--orange2);font-size:9px;letter-spacing:1.8px;font-weight:900}
.nav-label{
font-size:9px;color:#6f8198;font-weight:900;
letter-spacing:1.8px;padding:12px 10px;
}
.nav button{
display:flex;align-items:center;gap:13px;width:100%;
border:1px solid transparent;background:transparent;
color:#9eacbf;text-align:left;padding:12px 13px;
border-radius:13px;margin:3px 0;font-weight:650;
transition:.2s;
}
.nav button.active{
background:linear-gradient(100deg,#ff812e25,#ff812e08);
border-color:#ff812e45;color:#ffb47f;
box-shadow:inset 3px 0 #ff812e;
}
.nav button:hover{background:#202d3d;color:white}
.nav .ico{width:22px;text-align:center;font-size:17px}
.side-bottom{
margin-top:auto;border-top:1px solid var(--line);
padding:18px 8px 0;color:#77879b;font-size:11px;line-height:1.8;
}
.main{
margin-left:265px;padding:32px;
max-width:1750px;min-height:100vh;
}
.topbar{
display:flex;align-items:center;justify-content:space-between;
gap:15px;margin-bottom:28px;padding-bottom:23px;
border-bottom:1px solid #263447;
}
.eyebrow{
font-size:10px;color:var(--orange2);font-weight:900;
letter-spacing:2.3px;text-transform:uppercase;
}
.topbar h1{font-size:30px;margin:7px 0 5px;letter-spacing:-1.3px}
.top-actions{display:flex;gap:9px;align-items:center}

/* INDICADORES */
.cards{
display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
gap:15px;margin:18px 0;
}
.stat{
background:linear-gradient(145deg,#1a293a,#121b28);
border:1px solid #2c4056;border-radius:20px;
padding:21px;position:relative;overflow:hidden;
transition:.25s;
}
.stat:after{
content:"";position:absolute;width:110px;height:110px;
right:-45px;bottom:-55px;border-radius:50%;
background:#ff812e0b;
}
.stat:hover{
transform:translateY(-4px);
border-color:#9b623d;
box-shadow:0 12px 30px #0003;
}
.stat .label{color:#a8b6c8;font-size:12px;font-weight:650}
.stat strong{
display:block;font-size:25px;margin:14px 0 6px;
letter-spacing:-.9px;overflow-wrap:anywhere;
}
.stat small{color:#7f91a7;font-size:11px}
.stat-icon{
float:right;background:#ff812e1c;color:var(--orange2);
padding:11px;border-radius:13px;font-size:18px;
}

/* PAINÉIS */
.panel{
background:linear-gradient(145deg,#172333,#111a26);
border:1px solid #2b3d52;border-radius:20px;
padding:21px;margin-top:18px;overflow:hidden;
box-shadow:0 8px 25px #00000013;
}
.panel-head{
display:flex;justify-content:space-between;
align-items:center;gap:12px;margin-bottom:18px;
}
.panel h3{margin:0;font-size:15px;letter-spacing:.1px}
.toolbar{display:flex;gap:10px;align-items:center;margin:17px 0}
.search{max-width:450px}

/* TABELAS */
.table-wrap{
overflow:auto;border:1px solid #2a3b50;
border-radius:14px;background:#101925;
}
table{border-collapse:collapse;width:100%;min-width:760px}
th{
text-align:left;color:#9eafc3;font-size:10px;
text-transform:uppercase;letter-spacing:.9px;
padding:15px 13px;background:#172333;
border-bottom:1px solid #35475c;
white-space:nowrap;
}
td{padding:14px 13px;border-bottom:1px solid #263548;font-size:12px}
tr:last-child td{border:0}
tbody tr{transition:.15s}
tbody tr:hover{background:#26364a55}
.pill{
display:inline-block;padding:6px 10px;border-radius:30px;
background:#303e50;color:#e1e8f1;font-size:10px;font-weight:850;
}
.pill.green{background:#153d32;color:#69e3b5}
.pill.orange{background:#49301e;color:#ffb77d}
.pill.red{background:#48252c;color:#ff9999}
.actions{display:flex;gap:5px;white-space:nowrap}
.empty{padding:35px;text-align:center;color:var(--muted)}

/* SERVIÇOS */
.category-grid{
display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
}
.category{
background:linear-gradient(145deg,#1c2b3c,#141f2d);
border:1px solid #304358;border-radius:17px;padding:18px;
transition:.2s;
}
.category:hover{border-color:#805438;transform:translateY(-2px)}
.category h3{margin:0 0 13px;font-size:14px;color:var(--orange2)}
.service-row{
display:flex;justify-content:space-between;gap:8px;
padding:12px 0;border-top:1px solid #2b3b4f;font-size:12px;
}
.service-row b{white-space:nowrap;color:#fff}
.service-row small{line-height:1.8}

/* MODAL */
.modal-back{
position:fixed;inset:0;background:#000d;z-index:20;
display:none;align-items:center;justify-content:center;padding:15px;
backdrop-filter:blur(8px);
}
.modal-back.show{display:flex}
.modal{
width:min(740px,100%);max-height:91vh;overflow:auto;
background:linear-gradient(145deg,#192637,#111a26);
border:1px solid #40536a;border-radius:23px;padding:26px;
box-shadow:0 35px 110px #000b;
}
.modal-head{
display:flex;justify-content:space-between;align-items:center;
border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:12px;
}
.modal-head h2{font-size:19px;margin:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
.field.full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.notice{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6}
.total-preview{
grid-column:1/-1;padding:16px;border-radius:14px;
background:linear-gradient(100deg,#ff812e20,#ff812e08);
border:1px solid #ff812e50;
color:#ffbd8d;font-weight:900;margin:10px 0;
}
.low-stock{color:#ff9292;font-weight:800}

/* RESPONSIVIDADE */
@media(max-width:1150px){
.cards{grid-template-columns:repeat(2,1fr)}
.category-grid{grid-template-columns:repeat(2,1fr)}
.main{padding:24px}
.sidebar{width:235px}
.main{margin-left:235px}
}
@media(max-width:700px){
.sidebar{
width:auto;inset:auto 0 0 0;height:75px;padding:7px 5px;
background:#101a28f2;backdrop-filter:blur(20px);
border-right:0;border-top:1px solid #35475c;
}
.brand,.nav-label,.side-bottom{display:none}
.nav{display:flex;overflow-x:auto;gap:3px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
min-width:65px;flex-direction:column;justify-content:center;
gap:3px;padding:6px 4px;font-size:9px;margin:0;
}
.nav button.active{background:#ff812e20;border-color:#ff812e40;box-shadow:none}
.nav .ico{font-size:17px}
.main{margin:0;padding:19px 13px 100px}
.topbar{align-items:flex-start;margin-bottom:20px;gap:8px}
.topbar h1{font-size:23px}
.topbar .muted{font-size:11px}
.top-actions{gap:5px;flex-wrap:wrap;justify-content:flex-end}
.top-actions .btn{padding:9px;font-size:11px}
.top-actions .btn:not(.primary){display:none}
.cards{gap:9px}
.stat{padding:14px;border-radius:15px}
.stat strong{font-size:19px;margin:11px 0 5px}
.stat .label{font-size:11px}
.stat-icon{padding:7px;font-size:14px}
.category-grid{grid-template-columns:1fr}
.panel{padding:14px;border-radius:16px}
.panel-head{align-items:flex-start}
.panel-head .btn{font-size:11px;padding:9px}
.form-grid{grid-template-columns:1fr}
.field.full,.total-preview{grid-column:auto}
.modal{padding:17px;border-radius:18px}
.modal-actions .btn{flex:1}
.search{max-width:100%}
}
@media(max-width:380px){
.topbar h1{font-size:20px}
.stat strong{font-size:17px}
.nav button{min-width:58px;font-size:8px}
}
</style>
</head>

<body>

<section id="loginScreen" class="login">
<div class="login-card">
<div class="brand-mark">🔧</div>
<h1>Auto Center <span style="color:var(--orange)">São Bento</span></h1>
<p class="muted">Gestão inteligente da sua oficina. Entre para acessar seu painel.</p>
<form id="loginForm">
<div class="field">
<label>E-MAIL</label>
<input id="email" type="email" required autocomplete="username" placeholder="seu@email.com">
</div>
<div class="field">
<label>SENHA</label>
<input id="password" type="password" required autocomplete="current-password" placeholder="Sua senha">
</div>
<button class="btn primary" style="width:100%;margin-top:8px">Entrar no sistema</button>
</form>
<p id="loginMsg" class="notice"></p>
</div>
</section>

<div id="app" class="app hidden">
<aside class="sidebar">
<div class="brand">
<div class="brand-mark">🔧</div>
<div><b>AUTO CENTER<br>SÃO BENTO</b><small>PAINEL DE GESTÃO</small></div>
</div>
<div class="nav-label">MENU PRINCIPAL</div>
<nav id="nav" class="nav"></nav>
<div class="side-bottom">Sistema de gestão da oficina<br>Seus dados sincronizados na nuvem.</div>
</aside>

<main class="main">
<header class="topbar">
<div>
<div class="eyebrow">AUTO CENTER SÃO BENTO</div>
<h1 id="pageTitle">Visão geral</h1>
<div class="muted" id="pageSubtitle">Resumo da sua oficina</div>
</div>
<div class="top-actions">
<button class="btn" onclick="exportBackup()">Backup</button>
<button class="btn" onclick="logout()">Sair</button>
<button class="btn primary" onclick="quickNew()">＋ Novo cadastro</button>
</div>
</header>
<div id="content"></div>
</main>
</div>

<div id="modalBack" class="modal-back">
<div class="modal">
<div class="modal-head">
<h2 id="modalTitle">Novo cadastro</h2>
<button class="btn small" onclick="closeModal()">✕</button>
</div>
<form id="dataForm">
<div id="formFields" class="form-grid"></div>
<div class="modal-actions">
<button type="button" class="btn" onclick="closeModal()">Cancelar</button>
<button class="btn primary">Salvar registro</button>
</div>
</form>
</div>
</div>

<script>
const SUPABASE_URL='https://iueiooqpdcnelrbsggss.supabase.co';
const SUPABASE_KEY='sb_publishable_KEIUQoiiAxXzBn_6pcefjw_SjjX6Kae';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='acsb_v1_data';
const blank={products:[],clients:[],services:[],sales:[],appointments:[],orders:[],transactions:[]};
let db=structuredClone(blank),user=null,current='dashboard',editing=null,searchText='',timer=null;
const $=s=>document.querySelector(s);
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),id=()=>crypto.randomUUID();

const categories={
'Direção e terminais':[['Terminal',50],['Pivô sem rebite',50],['Pivô com rebite',100],['Axial',70]],
'Suspensão':[['Morceguinho',60],['Bandeja inferior carro passeio',100],['Bandeja inferior caminhonete',150],['Bandeja superior caminhonete',150],['Amortecedor dianteiro',100],['Amortecedor traseiro',100],['Kit amortecedor dianteiro',100],['Kit amortecedor traseiro',100],['Bieleta',50],['Troca de coxim do motor',70]],
'Freios':[['Pastilha dianteira',80],['Pastilha traseira',100],['Jogo de lona',100],['Cilindro de roda',50],['Troca de fluido',150],['Cilindro mestre',200],['Hidrovácuo',250]],
'Rolamentos':[['Rolamento dianteiro',100],['Rolamento traseiro',100]],
'Manutenção preventiva':[['Troca de óleo',50],['Filtro de cabine',50]],
'Alinhamento e geometria':[['Regulagem de eixo traseiro',60],['Alinhamento',60],['Balanceamento',30],['Cambagem',60],['Caster',90]]
};

const navItems=[
['dashboard','▦','Visão geral'],
['products','▣','Estoque'],
['sales','↗','Vendas'],
['clients','♙','Clientes'],
['services','🔧','Serviços e preços'],
['orders','▤','Ordens de serviço'],
['appointments','▦','Agendamentos'],
['transactions','＄','Financeiro'],
['reports','▥','Relatórios']
];

function renderNav(){
$('#nav').innerHTML=navItems.map(([k,ic,n])=>
`<button class="${current===k?'active':''}" onclick="go('${k}')"><span class="ico">${ic}</span>${n}</button>`
).join('');
}
function go(p){current=p;searchText='';render()}
function fmtDate(d){return d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—'}
function total(arr,key){return arr.reduce((s,x)=>s+(Number(x[key])||0),0)}
function pageHead(title,sub,button,action){
return `<div class="panel-head"><div><h3>${title}</h3><div class="muted" style="font-size:12px;margin-top:5px">${sub}</div></div>${button?`<button class="btn primary" onclick="${action}">＋ ${button}</button>`:''}</div>`;
}
function stat(label,value,icon,foot=''){
return `<div class="stat"><span class="stat-icon">${icon}</span><div class="label">${label}</div><strong>${value}</strong><small>${foot}</small></div>`;
}
function filtered(arr,keys){
return arr.filter(x=>!searchText||keys.some(k=>String(x[k]??'').toLowerCase().includes(searchText.toLowerCase())));
}
function toolbar(placeholder='Buscar...'){
return `<div class="toolbar"><input class="search" placeholder="${placeholder}" value="${esc(searchText)}" oninput="updateSearch(this)"></div>`;
}
function updateSearch(input){
searchText=input.value;
const start=input.selectionStart,pos=input.selectionEnd;
renderContentOnly();
const next=document.querySelector('.search');
if(next){next.focus();try{next.setSelectionRange(start,pos)}catch(e){}}
}
function table(headers,rows){
return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`;
}
function acts(type,x){
return `<div class="actions"><button class="btn small" onclick="openModal('${type}','${x.id}')">Editar</button><button class="btn small danger" onclick="del('${type}','${x.id}')">Excluir</button></div>`;
}
function serviceParts(s){return Number(s.partsPrice??s.materialPrice??0)}
function serviceLabor(s){return Number(s.laborPrice??s.price??0)}
function serviceTotal(s){return serviceParts(s)+serviceLabor(s)}
function serviceOptions(selected=''){
return `<option value="">Selecione o serviço</option>`+db.services.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name)} · ${money(serviceTotal(s))}</option>`).join('');
}
function productOptions(selected=''){
return `<option value="">Selecione um produto do estoque</option>`+db.products.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)} · estoque: ${Number(p.qty)||0} · ${money(p.price)}</option>`).join('');
}
function render(){
renderNav();
let names=Object.fromEntries(navItems.map(x=>[x[0],x[2]]));
$('#pageTitle').textContent=names[current];
$('#pageSubtitle').textContent='Controle sua oficina em um só lugar';
renderContentOnly();
}
let cfg={};

function renderContentOnly(){
let c=$('#content');

if(current==='dashboard'){
let inc=total(db.transactions.filter(x=>x.type==='Receita'),'amount');
let out=total(db.transactions.filter(x=>x.type==='Despesa'),'amount');
let low=db.products.filter(p=>Number(p.qty)<=Number(p.min||0)).length;

c.innerHTML=`
<div class="cards">
${stat('Clientes cadastrados',db.clients.length,'♙','Total de clientes')}
${stat('Produtos no estoque',db.products.length,'▣','Produtos cadastrados')}
${stat('Ordens em aberto',db.orders.filter(x=>!['Concluída','Entregue','Cancelada'].includes(x.status)).length,'🔧','Serviços pendentes')}
${stat('Saldo financeiro',money(inc-out),'＄','Receitas menos despesas')}
</div>
<div class="cards">
${stat('Produtos com estoque baixo',low,'⚠️','Atenção ao estoque')}
${stat('Vendas registradas',db.sales.filter(s=>s.status!=='Cancelada').length,'↗','Vendas concluídas')}
${stat('Mão de obra cadastrada',money(total(db.services,'laborPrice')),'🔧','Valor cadastrado')}
${stat('Peças em vendas',money(db.sales.filter(s=>s.status!=='Cancelada').reduce((a,s)=>a+Number(s.total||0),0)),'＄','Total vendido')}
</div>
<div class="panel">
${pageHead('Acesso rápido','Escolha uma área para continuar')}
<div class="category-grid">
${navItems.slice(1).map(([k,ic,n])=>`
<button class="btn" style="text-align:left;padding:19px" onclick="go('${k}')">
<span style="font-size:23px">${ic}</span><br>
<b>${n}</b>
<div class="muted" style="font-size:11px;margin-top:6px">Abrir módulo →</div>
</button>`).join('')}
</div>
</div>`;
return;
}

if(current==='services'){
let rows=db.services;
let groups=Object.keys(categories).map(cat=>{
let ss=rows.filter(s=>s.category===cat);
return `<div class="category"><h3>${esc(cat)}</h3>${ss.length?ss.map(s=>`
<div class="service-row">
<span>${esc(s.name)}<br><small class="muted">Peças: ${money(serviceParts(s))} · Mão de obra: ${money(serviceLabor(s))}</small></span>
<b>${money(serviceTotal(s))}</b>
</div>`).join(''):`<div class="muted" style="font-size:12px">Nenhum serviço cadastrado.</div>`}</div>`;
}).join('');

c.innerHTML=
pageHead('Catálogo de serviços','Cadastre separadamente peças/materiais e mão de obra. O total é calculado automaticamente.','Cadastrar serviço',"openModal('services')")+
`<div class="category-grid">${groups}</div>

let conf=cfg[current];
let arr=filtered(db[current],conf.keys);
let rows=arr.slice().reverse().map(x=>`<tr>${conf.row(x)}</tr>`).join('');
let extra=current==='transactions'?`<div class="cards">${stat('Receitas',money(total(db.transactions.filter(x=>x.type==='Receita'),'amount')),'↗')}${stat('Despesas',money(total(db.transactions.filter(x=>x.type==='Despesa'),'amount')),'↘')}</div>`:'';

function saleProductName(s){
return db.products.find(p=>p.id===s.productId)?.name||s.product||'Produto removido / venda antiga';
}
function quickNew(){
let p=current==='dashboard'?'clients':current;
openModal(['reports','services'].includes(p)?'services':p);
}

function makeField([k,label,kind,req,opts],old,type){
let val=old[k]??(k==='date'?today():k==='qty'?1:k==='status'?(type==='orders'?'Aberta':type==='sales'?'Concluída':'Agendado'):k==='partsPrice'?0:k==='laborPrice'?0:'');
let required=req===1?'required':'';
if(kind==='textarea')return `<div class="field full"><label>${label}${req===1?' *':''}</label><textarea name="${k}" rows="3">${esc(val)}</textarea></div>`;
if(kind==='select')return `<div class="field"><label>${label}${req===1?' *':''}</label><select name="${k}" ${required}>${(opts||[]).map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
if(kind==='serviceSelect')return `<div class="field"><label>${label}</label><select name="serviceId" id="serviceSelect">${serviceOptions(val)}</select></div>`;
if(kind==='productSelect')return `<div class="field full"><label>${label} *</label><select name="productId" id="productSelect" required>${productOptions(val)}</select></div>`;
return `<div class="field"><label>${label}${req===1?' *':''}</label><input name="${k}" type="${kind}" value="${esc(val)}" ${required} ${kind==='number'?'min="0" step="0.01"':''}></div>`;
}

function openModal(type,editId=null){
editing={type,id:editId};
let conf=type==='services'?{
title:'Serviço',
fields:[['name','Nome do serviço','text',1],['category','Categoria','select',1,Object.keys(categories)],['partsPrice','Valor de peças / materiais (R$)','number'],['laborPrice','Valor da mão de obra (R$)','number'],['duration','Duração estimada','text']]
}:cfg[type];
if(!conf)return;
let old=editId?db[type].find(x=>x.id===editId)||{}:{};
if(type==='services'&&editId)old={...old,partsPrice:old.partsPrice??old.materialPrice??0,laborPrice:old.laborPrice??old.price??0};
if(type==='orders'&&editId)old={...old,partsPrice:old.partsPrice??0,laborPrice:old.laborPrice??old.price??0};
if(type==='sales'&&editId)old={...old,productId:old.productId||'',status:old.status||'Concluída'};
$('#modalTitle').textContent=(editId?'Editar ':'Cadastrar ')+conf.title.toLowerCase();
$('#formFields').innerHTML=conf.fields.map(f=>makeField(f,old,type)).join('');
if(type==='services')$('#formFields').insertAdjacentHTML('beforeend','<div class="total-preview" id="serviceTotal">Total do serviço: R$ 0,00</div>');
if(type==='orders')$('#formFields').insertAdjacentHTML('beforeend','<div class="total-preview" id="orderTotal">Total da ordem: R$ 0,00</div>');
if(type==='sales')$('#formFields').insertAdjacentHTML('beforeend','<div class="total-preview" id="saleTotal">Total da venda: R$ 0,00</div><div class="notice full" id="stockInfo"></div>');
$('#modalBack').classList.add('show');
updatePreviews();
}

function closeModal(){$('#modalBack').classList.remove('show');editing=null}
function fieldNumber(name){return Number($('#dataForm [name="'+name+'"]')?.value||0)}

function updatePreviews(){
let t=editing?.type;
if(t==='services'){
let n=fieldNumber('partsPrice')+fieldNumber('laborPrice');
$('#serviceTotal').textContent='Total do serviço: '+money(n);
}
if(t==='orders'){
let n=fieldNumber('partsPrice')+fieldNumber('laborPrice');
let el=$('#dataForm [name="price"]');
if(el)el.value=n.toFixed(2);
$('#orderTotal').textContent='Total da ordem: '+money(n);
}
if(t==='sales'){
let q=fieldNumber('qty'),p=fieldNumber('unitPrice'),idp=$('#productSelect')?.value,prod=db.products.find(x=>x.id===idp);
$('#saleTotal').textContent='Total da venda: '+money(q*p);
$('#stockInfo').textContent=prod?`Disponível no estoque: ${Number(prod.qty)||0} unidade(s).`:'Selecione um produto cadastrado no estoque.';
}
}

$('#formFields').addEventListener('input',e=>{
if(['partsPrice','laborPrice','qty','unitPrice'].includes(e.target.name))updatePreviews();
});
$('#formFields').addEventListener('change',e=>{
if(e.target.id==='productSelect'){
let p=db.products.find(x=>x.id===e.target.value);
if(p)$('#dataForm [name="unitPrice"]').value=Number(p.price||0).toFixed(2);
updatePreviews();
}
if(e.target.id==='serviceSelect'){
let s=db.services.find(x=>x.id===e.target.value);
if(s){
$('#dataForm [name="service"]').value=s.name;
$('#dataForm [name="partsPrice"]').value=serviceParts(s).toFixed(2);
$('#dataForm [name="laborPrice"]').value=serviceLabor(s).toFixed(2);
updatePreviews();
}
}
});

function saleIsActive(s){return s.status!=='Cancelada'&&!!s.productId&&s.stockApplied!==false}
function restoreSaleStock(s){
if(!s?.productId||s.stockApplied===false)return;
let p=db.products.find(x=>x.id===s.productId);
if(p)p.qty=Number(p.qty||0)+Number(s.qty||0);
}
function applySaleStock(s){
if(s.status==='Cancelada'){s.stockApplied=false;return true}
let p=db.products.find(x=>x.id===s.productId);
if(!p){alert('Produto não encontrado no estoque. Selecione um produto cadastrado.');return false}
let qty=Number(s.qty||0);
if(qty<=0){alert('Informe uma quantidade maior que zero.');return false}
if(Number(p.qty||0)<qty){alert(`Estoque insuficiente de ${p.name}. Disponível: ${p.qty}.`);return false}
p.qty=Number(p.qty||0)-qty;
s.stockApplied=true;
return true;
}

$('#dataForm').onsubmit=async e=>{
e.preventDefault();
if(!editing)return;
let {type,id:editId}=editing;
let form=new FormData(e.currentTarget);
let obj=Object.fromEntries(form.entries());
['qty','min','cost','price','unitPrice','amount','partsPrice','laborPrice'].forEach(k=>{if(k in obj)obj[k]=Number(obj[k]||0)});

if(type==='services'){
obj.materialPrice=obj.partsPrice;
obj.price=obj.laborPrice;
obj.totalPrice=obj.partsPrice+obj.laborPrice;
}
if(type==='orders'){
if(obj.serviceId){
let s=db.services.find(x=>x.id===obj.serviceId);
if(s)obj.service=s.name;
}
obj.price=Number(obj.partsPrice||0)+Number(obj.laborPrice||0);
}
if(type==='sales'){
let product=db.products.find(p=>p.id===obj.productId);
if(!product){alert('Selecione um produto cadastrado no estoque.');return}
obj.product=product.name;
obj.total=Number(obj.qty)*Number(obj.unitPrice);
obj.stockApplied=obj.status!=='Cancelada';
}
obj.id=editId||id();

if(type==='sales'){
let index=editId?db.sales.findIndex(x=>x.id===editId):-1;
let old=index>=0?db.sales[index]:null;
let oldProduct=old?.productId?db.products.find(p=>p.id===old.productId):null;
let oldQty=old&&saleIsActive(old)?Number(old.qty||0):0;
if(oldQty&&oldProduct)oldProduct.qty=Number(oldProduct.qty||0)+oldQty;
if(!applySaleStock(obj)){
if(oldQty&&oldProduct)oldProduct.qty=Number(oldProduct.qty||0)-oldQty;
return;
}
if(index>=0)db.sales[index]={...old,...obj};
else db.sales.push(obj);
}else if(editId){
let i=db[type].findIndex(x=>x.id===editId);
if(i>=0)db[type][i]={...db[type][i],...obj};
}else db[type].push(obj);

await save();
closeModal();
render();
};

async function del(type,rid){
if(!confirm('Excluir este registro?'))return;
if(type==='sales'){
let s=db.sales.find(x=>x.id===rid);
if(s&&saleIsActive(s))restoreSaleStock(s);
}
db[type]=db[type].filter(x=>x.id!==rid);
await save();
render();
}

async function save(){
localStorage.setItem(KEY,JSON.stringify(db));
renderNav();
await sync();
}
async function sync(){
if(!user)return;
clearTimeout(timer);
timer=setTimeout(async()=>{
let {error}=await sb.from('auto_center_data').upsert({
user_id:user.id,data:db,updated_at:new Date().toISOString()
},{onConflict:'user_id'});
if(error)alert('Falha ao sincronizar: '+error.message);
},350);
}
async function logout(){await sb.auth.signOut()}

function seedServices(){
if(db.services.length)return;
Object.entries(categories).forEach(([category,items])=>
items.forEach(([name,price])=>
db.services.push({id:id(),name,category,partsPrice:0,laborPrice:price,price,totalPrice:price,duration:''})
));
localStorage.setItem(KEY,JSON.stringify(db));
}
function exportBackup(){
let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='backup-auto-center-sao-bento.json';
a.click();
URL.revokeObjectURL(a.href);
}

async function activate(u){
user=u;
$('#loginScreen').classList.add('hidden');
$('#app').classList.remove('hidden');
try{
let {data,error}=await sb.from('auto_center_data').select('data').eq('user_id',u.id).maybeSingle();
if(error)throw error;
if(data?.data)db={...structuredClone(blank),...data.data};
else{
let old=localStorage.getItem(KEY);
if(old)try{db={...structuredClone(blank),...JSON.parse(old)}}catch{}
await sb.from('auto_center_data').upsert({user_id:u.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});
}
seedServices();
db.services=db.services.map(s=>({...s,partsPrice:Number(s.partsPrice??s.materialPrice??0),laborPrice:Number(s.laborPrice??s.price??0)}));
db.sales=db.sales.map(s=>({...s,status:s.status||'Concluída',stockApplied:s.stockApplied??false}));
localStorage.setItem(KEY,JSON.stringify(db));
let {error:saveError}=await sb.from('auto_center_data').upsert({user_id:user.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});
if(saveError)throw saveError;
render();
}catch(e){
$('#loginMsg').textContent='Erro ao carregar dados: '+e.message;
$('#app').classList.add('hidden');
$('#loginScreen').classList.remove('hidden');
}
}

$('#loginForm').onsubmit=async e=>{
e.preventDefault();
$('#loginMsg').textContent='Conectando...';
let {data,error}=await sb.auth.signInWithPassword({
email:$('#email').value.trim(),
password:$('#password').value
});
if(error)$('#loginMsg').textContent='Não foi possível entrar: '+error.message;
else await activate(data.user);
};

sb.auth.getSession().then(({data})=>{
if(data.session)activate(data.session.user);
});
sb.auth.onAuthStateChange((event,session)=>{
if(event==='SIGNED_OUT'){
user=null;
$('#app').classList.add('hidden');
$('#loginScreen').classList.remove('hidden');
}
});
</script>
